# Solarized light. A light theme keeps the page light: the
# web view takes its background from here, not from the system.

[theme]
heading = #6C71C4
accent = #2AA198
muted = #93A1A1
good = #859900
warning = #B58900
danger = #DC322F
empty = #E3DCC6
background = #FDF6E3
surface = #F5EFDC
border = #E3DCC6
text = #586E75
