# Your own palette. Every one of the eleven keys is required; copy any of the
# themes beside this file and change the values.
#
# What each one paints:
#
#   background  the page behind everything, and nothing in the terminal --
#               a terminal supplies its own
#   surface     the card a provider sits on
#   border      the card's outline
#   text        the percentage, and the page's default ink
#   heading     provider names
#   accent      window labels: 7D, 5H, Claude/GPT 7D
#   muted       reset times, extras, the snapshot clock
#   good        a usage bar under 70%
#   warning     70% to 89%
#   danger      90% and over
#   empty       the unfilled part of a bar
#
# Then set `theme = custom` in config.ini.

[theme]
heading =
accent =
muted =
good =
warning =
danger =
empty =
background =
surface =
border =
text =
