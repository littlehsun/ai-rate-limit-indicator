# The one entry point for palettes. Everything that draws -- the terminal
# monitor and the web view -- reads its colours through this file.
#
# Each entry below names a file beside this one. The file's stem is the theme
# name, so `nord.ini` is `theme = nord` in config.ini. Loading order matters
# only for collisions: a later file redefining an existing name wins, which is
# how you override one of the shipped themes without editing it.
#
# To add your own palette, put the .ini beside this file and list it here.
# custom.ini is already reserved for exactly that.

[themes]
include =
    dracula.ini
    nord.ini
    gruvbox.ini
    tokyo-night.ini
    solarized-dark.ini
    catppuccin-mocha.ini
    one-dark.ini
    monochrome.ini
    solarized-light.ini
    catppuccin-latte.ini
    custom.ini
