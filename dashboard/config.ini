[monitor]
# The publish.py endpoint to read. This is the same URL the iOS widget uses,
# so whatever works there works here. No credential is needed and no provider
# quota is spent: the desktop already paid for these numbers.
endpoint = http://127.0.0.1:8477/usage.json

# dracula | nord | gruvbox | tokyo-night | solarized-dark | monochrome
theme = dracula

# zh-TW | en
language = zh-TW

# How often to re-read the snapshot, in seconds.
interval = 60

# ANSI true-color output and screen clearing. For journald, set both to false.
color = true
clear = true

# Seconds to wait on the publisher before falling back to the cache.
timeout = 8

# Where to keep the last snapshot seen, so an unreachable publisher shows the
# previous numbers with their age rather than a blank screen. Leave empty for
# ~/.cache/rate-limit-indicator/dashboard-snapshot.json
cache_file =

[providers]
# Which providers to show. The order on screen is always codex, claude, grok,
# gemini regardless of the order here.
codex = true
claude = true
grok = true
gemini = true
