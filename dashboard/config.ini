[monitor]
# The publish.py endpoint to read. This is the same URL the iOS widget uses,
# so whatever works there works here. No credential is needed and no provider
# quota is spent: the desktop already paid for these numbers.
endpoint = http://127.0.0.1:8477/usage.json

# Any theme listed in themes/themes.ini. `--list-themes` prints them.
# A light theme makes the web page light: the page takes its background from
# the palette, not from the system.
theme = dracula

# An alternative themes.ini to read palettes through. Leave empty for the one
# shipped beside this file in themes/.
themes =

# zh-TW | en
language = zh-TW

# How often to re-read the snapshot, in seconds.
interval = 60

# ANSI true-color output and screen clearing. For journald, set both to false.
color = true
clear = true

# Seconds to wait on the publisher before falling back to the cache.
timeout = 8

# Where to keep the last snapshot seen, so an unreachable publisher shows the
# previous numbers with their age rather than a blank screen. Leave empty for
# ~/.cache/rate-limit-indicator/dashboard-snapshot.json
cache_file =

[providers]
# Which providers to show. The order on screen is always codex, claude, grok,
# gemini regardless of the order here.
codex = true
claude = true
grok = true
gemini = true

[float]
# The floating desktop widget (usage_float.py). theme, language, interval and
# the provider switches above are shared with it, so the widget and the
# terminal never disagree.
#
# The endpoint is the exception. The widget runs on the machine the indicator
# runs on, so it reads that indicator's own snapshots.json directly and only
# falls back to the endpoint above when that file is missing -- or when the
# endpoint has been pointed somewhere other than the default, which is how a
# widget on a second machine reads this one's publisher.

# One line per provider instead of every window, and no reset countdowns.
compact = false

# Window opacity, 0.30 to 1.00. Scrolling on the widget changes it too.
# The floor is not zero on purpose: an invisible widget cannot be
# right-clicked to be made visible again.
opacity = 0.95

# Font scale, 0.70 to 2.00.
scale = 1.0

# Keep the widget above other windows.
on_top = true

# Window width in pixels. The height follows the content.
width = 320
